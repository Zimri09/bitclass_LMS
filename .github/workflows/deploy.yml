name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows you to manually trigger this from GitHub

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      # 3. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Build for web
      - name: Build web app
        run: flutter build web --release --base-href /

      # 5. Copy .htaccess into the build output
      - name: Copy .htaccess for SPA routing
        run: cp web/.htaccess build/web/.htaccess

      # 6. Deploy to FTP server
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          timeout: 120000
          local-dir: ./build/web/
          server-dir: ./  # Change this if your server needs files in a subfolder like public_html/
